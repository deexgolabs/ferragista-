<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fornecedores — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="fornecedores"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Fornecedores</h1>
        <button class="btn" id="btn-novo-fornecedor">Novo fornecedor</button>
      </div>

      <div class="form-inline">
        <input type="text" id="busca-fornecedor" placeholder="Buscar por nome" />
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Nome</th><th>CNPJ</th><th>Telefone</th><th>Contato</th><th></th></tr>
          </thead>
          <tbody id="tabela-fornecedores"></tbody>
        </table>
      </div>

      <dialog id="dialog-fornecedor">
        <form id="form-fornecedor" method="dialog">
          <h2 id="titulo-dialog-fornecedor">Novo fornecedor</h2>
          <input type="hidden" id="fornecedor-id" />
          <div class="campo"><label>Nome</label><input type="text" id="fornecedor-nome" required /></div>
          <div class="grade-campos">
            <div class="campo"><label>CNPJ</label><input type="text" id="fornecedor-cnpj" /></div>
            <div class="campo"><label>Telefone</label><input type="text" id="fornecedor-telefone" /></div>
          </div>
          <div class="campo"><label>E-mail</label><input type="email" id="fornecedor-email" /></div>
          <div class="campo"><label>Pessoa de contato</label><input type="text" id="fornecedor-contato" /></div>
          <div class="campo"><label>Endereço</label><input type="text" id="fornecedor-endereco" /></div>
          <div class="form-inline">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-fornecedor">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/fornecedores.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
