<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Movimentações de estoque — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="estoque"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Movimentações de estoque</h1>
        <button class="btn" id="btn-nova-movimentacao">Nova movimentação</button>
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th></tr>
          </thead>
          <tbody id="tabela-movimentacoes"></tbody>
        </table>
      </div>

      <dialog id="dialog-movimentacao">
        <form id="form-movimentacao" method="dialog">
          <h2>Nova movimentação</h2>
          <div class="campo">
            <label>Produto</label>
            <select id="movimentacao-produto" required></select>
          </div>
          <div class="grade-campos">
            <div class="campo">
              <label>Tipo</label>
              <select id="movimentacao-tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
                <option value="ajuste">Ajuste (define a quantidade exata)</option>
              </select>
            </div>
            <div class="campo"><label>Quantidade</label><input type="number" step="0.001" id="movimentacao-quantidade" required /></div>
          </div>
          <div class="campo"><label>Motivo</label><input type="text" id="movimentacao-motivo" placeholder="Ex: quebra, perda, inventário..." /></div>
          <div class="form-inline">
            <button type="submit" class="btn">Registrar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-movimentacao">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/estoque.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
