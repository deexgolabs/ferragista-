<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Financeiro — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="financeiro"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Financeiro</h1>
        <button class="btn" id="btn-novo-lancamento">Novo lançamento</button>
      </div>

      <div class="grade-cartoes" style="margin-bottom: 1.5rem;">
        <div class="painel"><h2>Entradas (pagas)</h2><div class="valor" id="resumo-entradas" style="font-size: 1.4rem;">—</div></div>
        <div class="painel"><h2>Saídas (pagas)</h2><div class="valor" id="resumo-saidas" style="font-size: 1.4rem;">—</div></div>
        <div class="painel"><h2>Saldo</h2><div class="valor" id="resumo-saldo" style="font-size: 1.4rem;">—</div></div>
        <div class="painel"><h2>A receber / A pagar</h2><div class="valor" id="resumo-pendentes" style="font-size: 1.1rem;">—</div></div>
      </div>

      <div class="form-inline">
        <select id="filtro-tipo">
          <option value="">Todos os tipos</option>
          <option value="entrada">Entradas</option>
          <option value="saida">Saídas</option>
        </select>
        <select id="filtro-status">
          <option value="">Todos os status</option>
          <option value="pago">Pago</option>
          <option value="pendente">Pendente</option>
        </select>
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="tabela-lancamentos"></tbody>
        </table>
      </div>

      <dialog id="dialog-lancamento">
        <form id="form-lancamento" method="dialog">
          <h2>Novo lançamento</h2>
          <div class="grade-campos">
            <div class="campo">
              <label>Tipo</label>
              <select id="lancamento-tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
              </select>
            </div>
            <div class="campo"><label>Valor</label><input type="number" step="0.01" id="lancamento-valor" required /></div>
          </div>
          <div class="campo"><label>Categoria</label><input type="text" id="lancamento-categoria" placeholder="Ex: aluguel, salários, venda avulsa..." /></div>
          <div class="campo"><label>Descrição</label><input type="text" id="lancamento-descricao" /></div>
          <div class="grade-campos">
            <div class="campo"><label>Data</label><input type="date" id="lancamento-data" /></div>
            <div class="campo">
              <label>Status</label>
              <select id="lancamento-status">
                <option value="pago">Pago</option>
                <option value="pendente">Pendente</option>
              </select>
            </div>
          </div>
          <div class="campo" id="campo-vencimento"><label>Vencimento (se pendente)</label><input type="date" id="lancamento-vencimento" /></div>
          <div class="form-inline">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-lancamento">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/financeiro.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
