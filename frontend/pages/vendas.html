<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PDV / Vendas — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="vendas"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>PDV / Vendas</h1>
      </div>

      <div class="pdv-layout">
        <div class="painel">
          <h2>Nova venda</h2>
          <div class="form-inline">
            <input type="text" id="codigo-barras-pdv" placeholder="📷 Escaneie o código de barras e pressione Enter" autocomplete="off" style="flex: 1; min-width: 240px;" />
          </div>
          <p id="erro-codigo-barras" class="mensagem-erro oculto"></p>
          <div class="campo-busca-wrapper">
            <input type="text" id="busca-produto-pdv" placeholder="Ou busque por nome ou código..." autocomplete="off" />
            <div class="resultados-busca-produto oculto" id="resultados-busca-produto"></div>
          </div>

          <div id="carrinho-vazio" class="texto-suave-pequeno" style="margin-top: 1rem;">Nenhum item adicionado ainda.</div>
          <div id="lista-carrinho" style="margin-top: 1rem;"></div>
        </div>

        <div class="painel">
          <h2>Pagamento</h2>
          <div class="campo">
            <label>Cliente (obrigatório para fiado)</label>
            <select id="pdv-cliente"><option value="">Cliente não identificado</option></select>
          </div>
          <div class="campo">
            <label>Forma de pagamento</label>
            <select id="pdv-forma-pagamento">
              <option value="dinheiro">Dinheiro</option>
              <option value="pix">PIX</option>
              <option value="cartao_debito">Cartão de débito</option>
              <option value="cartao_credito">Cartão de crédito</option>
              <option value="fiado">Fiado (fia na conta do cliente)</option>
            </select>
          </div>
          <div class="campo">
            <label>Desconto (R$)</label>
            <input type="number" step="0.01" id="pdv-desconto" value="0" />
          </div>

          <div class="pdv-total">
            <span>Total</span>
            <span id="pdv-total-valor">R$ 0,00</span>
          </div>

          <button type="button" class="btn btn-full" style="margin-top: 1.2rem;" id="btn-finalizar-venda">Finalizar venda</button>
          <p id="erro-pdv" class="mensagem-erro oculto"></p>
        </div>
      </div>

      <div class="painel" style="margin-top: 1.5rem;">
        <h2>Últimas vendas</h2>
        <table>
          <thead><tr><th>Data</th><th>Cliente</th><th>Forma de pagamento</th><th>Total</th><th>Status</th><th></th></tr></thead>
          <tbody id="tabela-vendas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/vendas.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
