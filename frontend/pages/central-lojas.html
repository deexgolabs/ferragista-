<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lojas — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="central-lojas"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Lojas</h1>
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Plano</th><th>Status</th><th>Trial expira</th><th>Produtos</th><th>Usuários</th><th></th></tr>
          </thead>
          <tbody id="tabela-lojas"></tbody>
        </table>
      </div>

      <dialog id="dialog-loja">
        <form id="form-loja" method="dialog">
          <h2>Editar loja</h2>
          <input type="hidden" id="loja-id" />
          <div class="campo">
            <label>Plano</label>
            <select id="loja-plano">
              <option value="gratuito">Gratuito</option>
              <option value="basico">Básico</option>
              <option value="premium">Premium</option>
            </select>
          </div>
          <div class="campo">
            <label>Status</label>
            <select id="loja-status">
              <option value="trial">Trial</option>
              <option value="ativa">Ativa</option>
              <option value="suspensa">Suspensa</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </div>
          <div class="campo"><label>Trial expira em</label><input type="date" id="loja-trial-expira" /></div>
          <div class="form-inline">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-loja">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout-central.js"></script>
  <script src="../js/central-lojas.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
