<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clientes — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="clientes"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Clientes</h1>
        <button class="btn" id="btn-novo-cliente">Novo cliente</button>
      </div>

      <div class="form-inline">
        <input type="text" id="busca-cliente" placeholder="Buscar por nome" />
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Nome</th><th>Telefone</th><th>Limite fiado</th><th>Saldo devedor</th><th></th></tr>
          </thead>
          <tbody id="tabela-clientes"></tbody>
        </table>
      </div>

      <dialog id="dialog-cliente">
        <form id="form-cliente" method="dialog">
          <h2 id="titulo-dialog-cliente">Novo cliente</h2>
          <input type="hidden" id="cliente-id" />
          <div class="campo"><label>Nome</label><input type="text" id="cliente-nome" required /></div>
          <div class="grade-campos">
            <div class="campo"><label>CPF/CNPJ</label><input type="text" id="cliente-cpf-cnpj" /></div>
            <div class="campo"><label>Telefone</label><input type="text" id="cliente-telefone" /></div>
          </div>
          <div class="campo"><label>E-mail</label><input type="email" id="cliente-email" /></div>
          <div class="campo"><label>Endereço</label><input type="text" id="cliente-endereco" /></div>
          <div class="campo"><label>Limite de fiado (R$)</label><input type="number" step="0.01" id="cliente-limite-fiado" value="0" /></div>
          <div class="form-inline">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-cliente">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/clientes.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
