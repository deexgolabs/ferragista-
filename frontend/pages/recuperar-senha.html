<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Recuperar senha — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="tela-auth">
    <div class="marca-auth">
      <div class="marca-icone"></div>
      <strong>Ferragista+</strong>
    </div>
    <div class="cartao-auth">
      <h1>Recuperar senha</h1>
      <form id="form-recuperar">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required />
        </div>
        <button type="submit" class="btn" style="width: 100%;">Enviar link de redefinição</button>
        <p id="mensagem-recuperar" class="oculto" style="text-align: center; margin-top: 1rem; font-size: 0.85rem;"></p>
      </form>
      <p style="text-align: center; margin-top: 1.2rem; font-size: 0.85rem;">
        <a href="login.html" style="color: var(--cor-primaria); font-weight: 600; text-decoration: none;">Voltar ao login</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/icones.js"></script>
  <script>
    document.querySelector(".marca-icone").innerHTML = svgIcone("wrench");

    document.getElementById("form-recuperar").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const resultado = await Api.esqueciSenha(document.getElementById("email").value);
      const mensagemEl = document.getElementById("mensagem-recuperar");
      mensagemEl.textContent = resultado.mensagem;
      mensagemEl.classList.remove("oculto");
      evento.target.reset();
    });
  </script>
  <script src="../js/pwa.js"></script>
</body>
</html>
