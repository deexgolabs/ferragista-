<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cadastre sua loja — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="tela-auth">
    <div class="marca-auth">
      <div class="marca-icone"></div>
      <strong>Ferragista+</strong>
      <span>14 dias grátis, sem cartão de crédito</span>
    </div>
    <div class="cartao-auth">
      <h1>Cadastre sua loja</h1>
      <form id="form-cadastro">
        <div class="campo">
          <label for="nome-loja">Nome da loja</label>
          <input type="text" id="nome-loja" required />
        </div>
        <div class="campo">
          <label for="nome-responsavel">Seu nome</label>
          <input type="text" id="nome-responsavel" required />
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn" style="width: 100%;">Criar minha conta grátis</button>
        <p id="erro-cadastro" class="mensagem-erro oculto"></p>
      </form>
      <p style="text-align: center; margin-top: 1.2rem; font-size: 0.85rem;">
        <span>Já tem uma conta?</span>
        <a href="login.html" style="color: var(--cor-primaria); font-weight: 600; text-decoration: none;">Entrar</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/icones.js"></script>
  <script>
    document.querySelector(".marca-icone").innerHTML = svgIcone("wrench");

    document.getElementById("form-cadastro").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const erroEl = document.getElementById("erro-cadastro");
      erroEl.classList.add("oculto");

      try {
        const resultado = await Api.cadastrarLoja({
          nome_loja: document.getElementById("nome-loja").value,
          nome_responsavel: document.getElementById("nome-responsavel").value,
          email: document.getElementById("email").value,
          senha: document.getElementById("senha").value,
        });
        setToken(resultado.access_token);
        localStorage.setItem("usuario", JSON.stringify(resultado.usuario));
        window.location.href = "/pages/dashboard.html";
      } catch (erro) {
        erroEl.textContent = erro.message;
        erroEl.classList.remove("oculto");
      }
    });
  </script>
  <script src="../js/pwa.js"></script>
</body>
</html>
