<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Produtos — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="produtos"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Produtos</h1>
        <button class="btn" id="btn-novo-produto">Novo produto</button>
      </div>

      <div class="form-inline">
        <input type="text" id="busca-produto" placeholder="Buscar por nome ou código" style="flex: 1; min-width: 220px;" />
        <select id="filtro-categoria"><option value="">Todas as categorias</option></select>
        <label style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.88rem;">
          <input type="checkbox" id="filtro-estoque-baixo" /> Só estoque baixo
        </label>
        <button type="button" class="btn btn-secundario" id="btn-nova-categoria">Nova categoria</button>
        <button type="button" class="btn btn-secundario" id="btn-importar-csv">Importar CSV</button>
        <input type="file" id="input-importar-csv" accept=".csv" class="oculto" />
      </div>
      <p class="texto-suave-pequeno" style="margin-top: -0.6rem; margin-bottom: 1rem;">
        Colunas do CSV: <code>nome,codigo,categoria,unidade,preco_custo,preco_venda,quantidade_estoque,estoque_minimo</code> — só <code>nome</code> é obrigatório.
      </p>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Nome</th><th>Código</th><th>Categoria</th><th>Preço custo</th><th>Preço venda</th><th>Estoque</th><th></th></tr>
          </thead>
          <tbody id="tabela-produtos"></tbody>
        </table>
      </div>

      <dialog id="dialog-produto">
        <form id="form-produto" method="dialog">
          <h2 id="titulo-dialog-produto">Novo produto</h2>
          <input type="hidden" id="produto-id" />
          <div class="campo"><label>Nome</label><input type="text" id="produto-nome" required /></div>
          <div class="grade-campos">
            <div class="campo"><label>Código / SKU</label><input type="text" id="produto-codigo" /></div>
            <div class="campo">
              <label>Categoria</label>
              <select id="produto-categoria"><option value="">Sem categoria</option></select>
            </div>
          </div>
          <div class="grade-campos">
            <div class="campo">
              <label>Unidade</label>
              <select id="produto-unidade">
                <option value="un">Unidade (un)</option>
                <option value="kg">Quilo (kg)</option>
                <option value="g">Grama (g)</option>
                <option value="m">Metro (m)</option>
                <option value="cm">Centímetro (cm)</option>
                <option value="L">Litro (L)</option>
                <option value="ml">Mililitro (ml)</option>
                <option value="cx">Caixa (cx)</option>
                <option value="pct">Pacote (pct)</option>
                <option value="par">Par</option>
                <option value="rolo">Rolo</option>
              </select>
            </div>
            <div class="campo"><label>Estoque mínimo</label><input type="number" step="0.001" id="produto-estoque-minimo" value="0" /></div>
          </div>
          <div class="grade-campos">
            <div class="campo"><label>Preço de custo</label><input type="number" step="0.01" id="produto-preco-custo" /></div>
            <div class="campo"><label>Preço de venda</label><input type="number" step="0.01" id="produto-preco-venda" required /></div>
          </div>
          <div class="campo" id="campo-quantidade-inicial"><label>Quantidade inicial em estoque</label><input type="number" step="0.001" id="produto-quantidade" value="0" /></div>
          <div class="form-inline">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-produto">Cancelar</button>
          </div>
        </form>
      </dialog>

      <dialog id="dialog-categoria">
        <form id="form-categoria" method="dialog">
          <h2>Nova categoria</h2>
          <div class="campo"><label>Nome</label><input type="text" id="categoria-nome" required /></div>
          <div class="form-inline">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-categoria">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/produtos.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
