<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Usuários — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="usuarios"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Usuários</h1>
        <button class="btn" id="btn-novo-usuario">Novo usuário</button>
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="tabela-usuarios"></tbody>
        </table>
      </div>

      <dialog id="dialog-usuario">
        <form id="form-usuario" method="dialog">
          <h2 id="titulo-dialog-usuario">Novo usuário</h2>
          <input type="hidden" id="usuario-id" />
          <div class="campo"><label>Nome</label><input type="text" id="usuario-nome" required /></div>
          <div class="campo" id="campo-usuario-email"><label>E-mail</label><input type="email" id="usuario-email" required /></div>
          <div class="campo" id="campo-usuario-senha"><label>Senha</label><input type="password" id="usuario-senha" minlength="6" /></div>
          <div class="campo">
            <label>Perfil</label>
            <select id="usuario-perfil">
              <option value="vendedor">Vendedor — PDV e clientes</option>
              <option value="estoquista">Estoquista — produtos, estoque, fornecedores e compras</option>
              <option value="gerente">Gerente — tudo, exceto usuários</option>
              <option value="admin">Admin — acesso total</option>
            </select>
          </div>
          <div class="campo"><label>Comissão sobre vendas (%)</label><input type="number" step="0.01" min="0" max="100" id="usuario-comissao" value="0" /></div>
          <div class="campo oculto" id="campo-usuario-ativo">
            <label style="display: flex; align-items: center; gap: 0.4rem;">
              <input type="checkbox" id="usuario-ativo" checked style="width: auto;" /> Usuário ativo
            </label>
          </div>
          <div class="form-inline">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn btn-secundario" id="btn-cancelar-usuario">Cancelar</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/usuarios.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
