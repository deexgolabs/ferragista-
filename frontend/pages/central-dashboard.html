<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Painel central — Ferragista+</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
  <link rel="icon" href="/assets/img/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#d15a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
</head>
<body>
  <div class="app">
    <div id="barra-lateral" data-pagina="central-dashboard"></div>
    <main class="conteudo">
      <div class="topo-pagina">
        <h1>Painel central</h1>
      </div>

      <div class="grade-indicadores">
        <div class="indicador"><div><div class="valor" id="valor-total-lojas">—</div><div class="rotulo">Lojas cadastradas</div></div></div>
        <div class="indicador"><div><div class="valor" id="valor-trial">—</div><div class="rotulo">Em trial</div></div></div>
        <div class="indicador"><div><div class="valor" id="valor-ativas">—</div><div class="rotulo">Ativas</div></div></div>
        <div class="indicador"><div><div class="valor" id="valor-suspensas">—</div><div class="rotulo">Suspensas/canceladas</div></div></div>
      </div>

      <div class="painel">
        <h2>Lojas com mais vendas</h2>
        <table>
          <thead><tr><th>Loja</th><th>Total de vendas</th></tr></thead>
          <tbody id="tabela-top-lojas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/layout-central.js"></script>
  <script src="../js/central-dashboard.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
